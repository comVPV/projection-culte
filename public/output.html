<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sortie</title>
<link rel="stylesheet" id="fontcss" href="/fonts.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body.bg-green { background: #00ff00; }
  body.bg-black { background: #000; }
  body.bg-checker { background: #555 repeating-conic-gradient(#666 0 25%, #4a4a4a 0 50%) 0 0 / 40px 40px; }
  #stage { position: absolute; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; font-family: var(--font); }
  .layer { position: absolute; inset: 0; opacity: 0; transition: opacity .3s ease; pointer-events: none; }
  .layer.on { opacity: 1; }

  /* ---------- Fond (écrans auxiliaires : ?screen=1) ---------- */
  #bgl { position: absolute; inset: 0; background: #000; display: none; }
  #bgl video, #bgl img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  #bgl .dim { position: absolute; inset: 0; background: #000; }

  /* ---------- Médias ---------- */
  #media .panel, #media .img { position: absolute; transition: all .4s ease; }
  #media .panel { background-color: var(--m-panel); background-image: var(--m-img); background-size: cover; background-position: center; }
  #media .img, #media .vid { object-fit: contain; }
  #media .vid { position: absolute; transition: all .4s ease; background: #000; }
  #media.pip .img, #media.pip .vid { border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.55); object-fit: cover; }
  #media .card { position: absolute; transition: all .4s ease; display: none; align-items: center; justify-content: center; text-align: center; box-sizing: border-box; padding: 40px 60px; color: var(--v-color); font-family: var(--font); overflow: hidden; }
  #media.pip .card { background-color: var(--m-panel); background-image: var(--m-img); background-size: cover; background-position: center; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.55); padding: 24px 28px; }
  .card .ci { width: 100%; }
  .card .c-t { font-size: 1.45em; font-weight: 800; color: var(--v-ref); line-height: 1.15; margin-bottom: .45em; }
  .card .c-d { font-size: 1em; font-weight: 600; margin-top: .25em; }
  .card .c-p { font-size: .9em; margin-top: .25em; opacity: .95; }
  .card .c-s { font-size: .8em; margin-top: .6em; color: var(--v-ref); font-weight: 600; }
  .card .c-x { font-size: .62em; margin-top: .8em; opacity: .9; line-height: 1.3; white-space: pre-line; }

  /* ---------- Bandeaux (lower thirds) ---------- */
  #lower .lt { position: absolute; bottom: 80px; max-width: 1400px; padding: 18px 40px 18px 30px; box-sizing: border-box; background: var(--lt-bg); color: var(--lt-color); font-family: var(--font); border-left: 10px solid var(--lt-accent); border-radius: 0 14px 14px 0; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  #lower.pos-left .lt { left: 90px; }
  #lower.pos-center .lt { left: 50%; transform: translateX(-50%); border: 0; border-bottom: 8px solid var(--lt-accent); border-radius: 14px; text-align: center; }
  #lower.pos-right .lt { right: 90px; border-left: 0; border-right: 10px solid var(--lt-accent); border-radius: 14px 0 0 14px; text-align: right; }
  #lower .lt-t { font-size: var(--lt-size); font-weight: 700; line-height: 1.15; }
  #lower .lt-s { font-size: calc(var(--lt-size) * .62); margin-top: .2em; opacity: .92; line-height: 1.2; }

  /* ---------- Chrono (moniteur du prédicateur) ---------- */
  #chrono { position: absolute; display: none; z-index: 5; font-family: var(--font); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--c-color); font-size: var(--c-size); line-height: 1; text-shadow: 0 2px 10px rgba(0,0,0,.7); padding: 14px 26px; }
  #chrono.tr { top: 14px; right: 24px; } #chrono.tl { top: 14px; left: 24px; } #chrono.br { bottom: 14px; right: 24px; } #chrono.bl { bottom: 14px; left: 24px; }

  /* ---------- Versets ---------- */
  #verse .box { position: absolute; color: var(--v-color); font-family: var(--font); overflow: hidden; box-sizing: border-box;
    background-image: linear-gradient(var(--v-tint), var(--v-tint)), var(--v-img); background-size: cover; background-position: center; background-repeat: no-repeat; }
  #verse .in { display: flex; gap: .9em; }
  #verse .vb { flex: 1; min-width: 0; }
  #verse .vtxt { line-height: 1.28; }
  #verse .vtxt sup { font-size: .55em; color: var(--v-ref); margin-right: .25em; vertical-align: super; }
  #verse .vref { margin-top: .5em; font-size: var(--v-refsize, .52em); color: var(--v-ref); font-weight: 700; letter-spacing: .02em; }
  #verse.lower .box { left: 110px; right: 110px; bottom: 56px; padding: 34px 56px; border-radius: 20px; }
  #verse.center .box { left: 190px; right: 190px; top: 50%; transform: translateY(-50%); padding: 50px 70px; border-radius: 24px; }
  #verse.side .box { right: 0; top: 0; bottom: 0; width: 740px; padding: 70px 56px; display: flex; align-items: center; }
  #verse.side .in { flex-direction: column; }
  #verse.full .box { inset: 0; padding: 90px 150px; background-image: linear-gradient(var(--v-tintfull), var(--v-tintfull)), var(--v-img); display: flex; align-items: center; text-align: center; }
  #verse.full .in { width: 100%; }

  /* ---------- Paroles ---------- */
  #lyrics .box { position: absolute; left: 90px; right: 90px; text-align: center; color: var(--l-color); font-family: var(--font);
    font-weight: var(--l-weight); line-height: 1.22; paint-order: stroke fill; -webkit-text-stroke: .11em var(--l-outline);
    text-shadow: 0 .05em .18em rgba(0,0,0,.55); box-sizing: border-box; }
  #lyrics.bottom .box { bottom: 60px; }
  #lyrics.center .box { top: 50%; transform: translateY(-50%); }
  #lyrics.upper .box { text-transform: uppercase; }

  /* ---------- Guide caméra ---------- */
  #guide { position: absolute; border: 6px dashed #00e676; background: rgba(0,230,118,.12); color: #00e676; font: 700 34px Arial; display: none;
    align-items: center; justify-content: center; text-align: center; transition: all .4s ease; box-sizing: border-box; }
</style>
</head>
<body>
<div id="stage">
  <div id="bgl"><video muted loop autoplay playsinline></video><img alt=""><div class="dim"></div></div>
  <div id="media" class="layer"><div class="panel"></div><img class="img" alt=""><video class="vid" playsinline preload="auto"></video><div class="card"><div class="ci"></div></div></div>
  <div id="verse" class="layer lower"><div class="box"><div class="in"></div></div></div>
  <div id="lyrics" class="layer bottom"><div class="box"></div></div>
  <div id="lower" class="layer pos-left"><div class="lt"><div class="lt-t"></div><div class="lt-s"></div></div></div>
  <div id="guide">ZONE CAMÉRA</div>
  <div id="chrono" class="tr"></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const MONITOR = q.get('monitor') === '1';   // moniteur prédicateur : verset en plein écran uniquement
const SCREEN = q.get('screen') === '1';     // écran auxiliaire : fond vidéo/image opaque
const PREVIEW = q.get('preview') === '1';   // aperçu dans la régie : vidéo muette
const only = MONITOR ? 'verse' : (q.get('layer') || 'all');
document.body.classList.add('bg-' + (q.get('bg') || (SCREEN || MONITOR ? 'black' : 'transparent')));

const stage = document.getElementById('stage');
function rescale() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = 'scale(' + s + ')';
  stage.style.left = (innerWidth - 1920 * s) / 2 + 'px';
  stage.style.top = (innerHeight - 1080 * s) / 2 + 'px';
}
addEventListener('resize', rescale); rescale();

// rectangles [x, y, w, h] dans un canevas 1920x1080 ; "cam" = zone libre pour la caméra
function mediaRects(layout, M) {
  const cw = Math.max(200, Math.min(1000, +M.camWidth || 640)), sc = Math.max(0.3, Math.min(1, (+M.imgScale || 100) / 100)), ps = Math.max(200, Math.min(1100, +M.pipSize || 560));
  const fitIn = (x, y, w, h) => {
    let iw = w, ih = w * 9 / 16; if (ih > h) { ih = h; iw = h * 16 / 9; }
    iw *= sc; ih *= sc; return [x + (w - iw) / 2, y + (h - ih) / 2, iw, ih];
  };
  const ph = ps * 9 / 16, pw = 1920 - cw;
  switch (layout) {
    case 'split-r': return { panel: [cw, 0, pw, 1080], img: fitIn(cw, 0, pw, 1080), cam: [0, 0, cw, 1080] };
    case 'split-l': return { panel: [0, 0, pw, 1080], img: fitIn(0, 0, pw, 1080), cam: [pw, 0, cw, 1080] };
    case 'pip-br': return { img: [1920 - ps - 60, 1080 - ph - 60, ps, ph], cam: [0, 0, 1920, 1080] };
    case 'pip-bl': return { img: [60, 1080 - ph - 60, ps, ph], cam: [0, 0, 1920, 1080] };
    case 'pip-tr': return { img: [1920 - ps - 60, 60, ps, ph], cam: [0, 0, 1920, 1080] };
    case 'pip-tl': return { img: [60, 60, ps, ph], cam: [0, 0, 1920, 1080] };
    default: return { panel: [0, 0, 1920, 1080], img: [0, 0, 1920, 1080], cam: null };
  }
}
const VERSE_CAM = { side: [0, 0, 1180, 1080] };

const place = (el, r) => { if (!r) { el.style.opacity = 0; return; } el.style.opacity = 1; el.style.left = r[0] + 'px'; el.style.top = r[1] + 'px'; el.style.width = r[2] + 'px'; el.style.height = r[3] + 'px'; };
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const hexA = (hex, a) => { const n = parseInt(String(hex).slice(1), 16) || 0; return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
const cssUrl = u => u ? 'url("' + String(u).replace(/"/g, '%22') + '")' : 'none';

function fit(box, inner, startPx, availH, minPx = 26) {
  let s = startPx; box.style.fontSize = s + 'px';
  while (inner.offsetHeight > availH && s > minPx) { s -= 2; box.style.fontSize = s + 'px'; }
}

let chronoOffset = 0;
function fmtChrono(ms) {
  const t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60, p = n => String(n).padStart(2, '0');
  return h ? h + ':' + p(m) + ':' + p(s) : p(m) + ':' + p(s);
}
function tickChrono() {
  if (!state || !state.chrono) return;
  const c = state.chrono, ms = c.base + (c.running ? Date.now() + chronoOffset - c.startedAt : 0);
  document.getElementById('chrono').textContent = fmtChrono(ms);
}
setInterval(() => { if (MONITOR) tickChrono(); }, 250);

let last = {};
const changed = (k, v) => { const j = JSON.stringify(v); if (last[k] === j) return false; last[k] = j; return true; };

function render(S) {
  const root = document.documentElement.style, T = S.theme;
  root.setProperty('--font', T.font);
  const VT = MONITOR ? T.monitor : T.verse;
  root.setProperty('--v-color', VT.color); root.setProperty('--v-ref', VT.refColor);
  root.setProperty('--v-refsize', ((+VT.refSize || 52) / 100) + 'em');
  const LT = T.lower;
  root.setProperty('--lt-color', LT.color); root.setProperty('--lt-accent', LT.accent); root.setProperty('--lt-bg', hexA(LT.bg, LT.bgAlpha)); root.setProperty('--lt-size', LT.size + 'px');
  root.setProperty('--c-color', T.monitor.chronoColor); root.setProperty('--c-size', T.monitor.chronoSize + 'px');
  const hasImg = !!VT.bgImage;
  root.setProperty('--v-img', cssUrl(VT.bgImage));
  root.setProperty('--v-tint', hexA(VT.bg, T.verse.bgAlpha));
  root.setProperty('--v-tintfull', hexA(VT.bg, hasImg ? (MONITOR ? 0.5 : Math.min(T.verse.bgAlpha, 0.7)) : 1));
  root.setProperty('--l-color', T.lyrics.color); root.setProperty('--l-outline', T.lyrics.outline); root.setProperty('--l-weight', T.lyrics.weight);
  root.setProperty('--m-panel', T.media.panel); root.setProperty('--m-img', cssUrl(T.media.bgImage));

  const show = k => only === 'all' || only === k;
  let cam = null;

  // --- fond (écran auxiliaire uniquement)
  const bgl = document.getElementById('bgl');
  if (SCREEN) {
    bgl.style.display = 'block';
    const B = S.background || {}, vid = bgl.querySelector('video'), im = bgl.querySelector('img');
    bgl.querySelector('.dim').style.opacity = B.dim == null ? 0.35 : B.dim;
    if (B.src && B.type === 'video') {
      im.style.display = 'none'; vid.style.display = 'block';
      if (vid.getAttribute('src') !== B.src) vid.src = B.src;
      vid.play().catch(() => {});
    } else if (B.src) {
      vid.style.display = 'none'; vid.removeAttribute('src'); vid.load(); im.style.display = 'block';
      if (im.getAttribute('src') !== B.src) im.src = B.src;
    } else { vid.style.display = 'none'; im.style.display = 'none'; if (vid.getAttribute('src')) { vid.removeAttribute('src'); vid.load(); } }
  }

  // --- médias (image, vidéo ou fiche d'annonce)
  const M = S.live.media, mEl = document.getElementById('media');
  const mimg = mEl.querySelector('.img'), mvid = mEl.querySelector('.vid'), mcard = mEl.querySelector('.card');
  const showM = show('media') && M.on;
  mEl.classList.toggle('on', showM);
  if (showM) {
    const kind = M.kind || 'image', lay = mediaRects(M.layout, T.media);
    mEl.classList.toggle('pip', M.layout.startsWith('pip'));
    place(mEl.querySelector('.panel'), lay.panel);
    if (kind === 'image') { if (mimg.getAttribute('src') !== M.src) mimg.src = M.src; place(mimg, lay.img); } else place(mimg, null);
    if (kind === 'card') {
      mcard.style.display = 'flex'; place(mcard, lay.img);
      if (changed('card', [M.card, M.layout, T.font, T.media, T.verse.color, T.verse.refColor, T.media.imgScale])) {
        const c = M.card || {}, ci = mcard.querySelector('.ci');
        ci.innerHTML = '<div class="c-t">' + esc(c.title || '') + '</div><div class="c-d">' + esc((c.date || '') + (c.time ? '  ·  ' + c.time : '')) + '</div>' +
          (c.place ? '<div class="c-p">' + esc(c.place) + '</div>' : '') + (c.speaker ? '<div class="c-s">' + esc(c.speaker) + '</div>' : '') + (c.extra ? '<div class="c-x">' + esc(c.extra) + '</div>' : '');
        const pad = M.layout.startsWith('pip') ? 48 : 120;
        fit(mcard, ci, M.layout.startsWith('pip') ? 34 : 64, lay.img[3] - pad, 14);
      }
    } else mcard.style.display = 'none';
    if (kind === 'video') {
      place(mvid, lay.img);
      const V = M.video || {};
      if (mvid.dataset.src !== M.src) { mvid.dataset.src = M.src; mvid.src = M.src; mvid.dataset.rev = ''; }
      mvid.loop = !!V.loop; mvid.muted = PREVIEW || !!V.muted;
      if (mvid.dataset.rev !== String(V.rev)) { mvid.dataset.rev = String(V.rev); try { mvid.currentTime = 0; } catch {} }
      if (V.playing) { const pr = mvid.play(); if (pr) pr.catch(() => { mvid.muted = true; mvid.play().catch(() => {}); }); } else mvid.pause();
    } else { place(mvid, null); mvid.pause(); }
    cam = lay.cam;
  } else if (!mvid.paused) mvid.pause();

  // --- versets
  const V = S.live.verse, vEl = document.getElementById('verse');
  const vLayout = MONITOR ? 'full' : V.layout;
  vEl.classList.toggle('on', show('verse') && V.on);
  if (V.on && show('verse')) {
    vEl.className = 'layer on ' + vLayout;
    if (!MONITOR && VERSE_CAM[V.layout]) cam = VERSE_CAM[V.layout];
    if (changed('verse', [V, VT.size, VT.refSize, vLayout, T.font])) {
      const box = vEl.querySelector('.box'), inner = vEl.querySelector('.in');
      inner.innerHTML = V.versions.map(ver => {
        const multi = ver.texts.length > 1;
        const txt = ver.texts.map(t => (multi ? '<sup>' + t.v + '</sup>' : '') + esc(t.text)).join(' ');
        return '<div class="vb"><div class="vtxt">' + txt + '</div><div class="vref">' + esc(V.ref) + ' — ' + esc(ver.abbr) + '</div></div>';
      }).join('');
      const avail = { lower: 400, center: 640, side: 900, full: 860 }[vLayout] || 400;
      fit(box, inner, VT.size, avail);
    }
  } else vEl.className = 'layer ' + vLayout;

  // --- paroles
  const L = S.live.lyrics, lEl = document.getElementById('lyrics');
  lEl.classList.toggle('on', show('lyrics') && L.on);
  if (L.on && show('lyrics')) {
    lEl.className = 'layer on ' + L.layout + (T.lyrics.upper ? ' upper' : '');
    if (changed('lyrics', [L, T.lyrics, T.font])) {
      const box = lEl.querySelector('.box');
      box.innerHTML = '<div class="in">' + L.lines.map(esc).join('<br>') + '</div>';
      fit(box, box.firstChild, T.lyrics.size, L.layout === 'center' ? 820 : 420, 30);
    }
  } else lEl.className = 'layer ' + L.layout;

  // --- bandeau (jamais sur le moniteur du prédicateur)
  const W = S.live.lower, wEl = document.getElementById('lower');
  wEl.classList.toggle('on', show('lower') && W.on);
  wEl.classList.remove('pos-left', 'pos-center', 'pos-right'); wEl.classList.add('pos-' + (LT.pos || 'left'));
  if (W.on && show('lower') && changed('lower', [W.title, W.sub])) {
    wEl.querySelector('.lt-t').textContent = W.title;
    const ls = wEl.querySelector('.lt-s'); ls.textContent = W.sub || ''; ls.style.display = W.sub ? '' : 'none';
  }

  // --- chrono (moniteur uniquement)
  const ch = document.getElementById('chrono');
  if (MONITOR && S.chrono && S.chrono.visible) { ch.style.display = 'block'; ch.className = T.monitor.chronoPos || 'tr'; tickChrono(); } else ch.style.display = 'none';

  // --- guide caméra (pour régler OBS / vMix)
  const g = document.getElementById('guide');
  if (S.guide && cam && !MONITOR) { g.style.display = 'flex'; place(g, cam); g.style.opacity = 1; } else g.style.display = 'none';
}

// ---- polices : recharger quand la liste ou la police change, puis re-mesurer ----
let state, fontsKey = null, fontReady = {};
function rerender() { last = {}; if (state) render(state); }
function ensureFont(S) {
  const f = S.theme.font; if (fontReady[f]) return; fontReady[f] = true;
  const fam = f.split(',')[0].trim();
  document.fonts.load('40px ' + fam).then(rerender, rerender);
}
function onState(S) {
  state = S;
  if (S.chrono) chronoOffset = S.chrono.now - Date.now();
  const k = JSON.stringify(S.fonts);
  if (fontsKey !== null && k !== fontsKey) {
    const l = document.getElementById('fontcss');
    l.onload = () => { fontReady = {}; ensureFont(state); rerender(); };
    l.href = '/fonts.css?v=' + Date.now();
  }
  fontsKey = k;
  render(S); ensureFont(S);
}

let ws;
function connect() {
  ws = new WebSocket('ws://' + location.host);
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'state') onState(m.state); };
  ws.onclose = () => setTimeout(connect, 1000);
}
connect();
</script>
</body>
</html>
